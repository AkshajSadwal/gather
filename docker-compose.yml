services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: instagram_clone
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d instagram_clone"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
