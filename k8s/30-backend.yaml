apiVersion: v1
kind: ConfigMap
metadata:
  name: gather-backend-config
data:
  NODE_ENV: "production"
  BACKEND_PORT: "4000"
  BACKEND_URL: "http://backend:4000"
  FRONTEND_URL: "http://localhost:30080"
  NEXT_PUBLIC_API_URL: "http://localhost:30400"
  MINIO_ENABLED: "true"
  MINIO_ENDPOINT: "http://minio:9000"
  MINIO_PUBLIC_ENDPOINT: "http://localhost:30900"
  MINIO_BUCKET: "gather-media"
  MINIO_REGION: "us-east-1"
  MINIO_PRESIGN_EXPIRES_SECONDS: "300"
  MEDIASOUP_WORKER_COUNT: "1"
  MEDIASOUP_LISTEN_IP: "0.0.0.0"
  MEDIASOUP_ANNOUNCED_ADDRESS: "192.168.49.2"
  MEDIASOUP_RTC_MIN_PORT: "40000"
  MEDIASOUP_RTC_MAX_PORT: "49999"
  MEDIASOUP_ENABLE_UDP: "true"
  MEDIASOUP_ENABLE_TCP: "true"
  MEDIASOUP_PREFER_UDP: "true"
  CALL_RING_TIMEOUT_MS: "45000"
  CALL_RECONNECT_GRACE_MS: "15000"
  NEXT_PUBLIC_STUN_URL: "stun:stun.l.google.com:19302"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: NodePort
  selector:
    app: gather-backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 30400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gather-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gather-backend
  template:
    metadata:
      labels:
        app: gather-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 20
      containers:
        - name: backend
          image: gather-backend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false          
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: gather-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: AUTH_SECRET
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: INTERNAL_AUTH_SECRET
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: MINIO_SECRET_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health/live
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
