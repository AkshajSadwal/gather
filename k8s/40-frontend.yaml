apiVersion: v1
kind: ConfigMap
metadata:
  name: gather-frontend-config
data:
  NODE_ENV: "production"
  AUTH_URL: "http://localhost:30080"
  NEXTAUTH_URL: "http://localhost:30080"
  BACKEND_URL: "http://backend:4000"
  NEXT_PUBLIC_GOOGLE_LOGIN: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: gather-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gather-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gather-frontend
  template:
    metadata:
      labels:
        app: gather-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: gather-frontend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false          
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: gather-frontend-config
          env:
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: AUTH_SECRET
            - name: INTERNAL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: INTERNAL_AUTH_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gather-app-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
